name: Orbit M4 Flutter validation

on:
  push:
    branches:
      - feature/m4-social-graph-flutter
      - integration/m2-m5-flutter-consolidated-2026-10-24
      - feature/m5-circles-flutter-integration
  pull_request:
    branches:
      - feature/m3-completion-offline
  workflow_dispatch:

# Only the latest M4 feature-branch commit needs an expensive native build.
concurrency:
  group: m4-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m4-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Hosted Ubuntu images include large SDKs unrelated to Orbit. The M4
      # native-plugin APK previously failed solely because the runner filled up.
      # Do not remove the Android SDK: Gradle needs it for this build.
      - name: Recover runner disk space for Android native build
        run: |
          df -h .
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h .
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      # Gradle can fail on a transient/corrupted Android NDK download even
      # after disk cleanup; retry the exact NDK required by pinned Flutter.
      - name: Install Android NDK with retry
        run: |
          for attempt in 1 2 3; do
            if "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"; then
              exit 0
            fi
            sudo rm -rf "${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
            if [ "${attempt}" -eq 3 ]; then exit 1; fi
            sleep 6
          done
      - name: Analyze M4 Flutter implementation
        run: |
          dart analyze lib/features/friends lib/core/navigation/orbit_invite_link_runtime.dart lib/app/app.dart lib/features/auth/data/orbit_identity_client.dart lib/features/home/presentation/widgets/favorite_person_tile.dart lib/features/profile/presentation/screens/profile_settings_screen.dart lib/features/profile/presentation/screens/privacy_setting_screen.dart lib/features/profile/presentation/screens/blocked_users_screen.dart lib/features/profile/presentation/screens/orbit_live_blocked_users_screen.dart lib/features/welcome/presentation/screens/invite_people_screen.dart test/features/friends
      - name: Analyze M5 Circles implementation
        run: dart analyze lib/features/circles lib/features/welcome/presentation/screens/create_circle_screen.dart lib/features/welcome/presentation/screens/circle_permission_screen.dart
      - name: M4 repository and widgets
        run: flutter test test/features/friends/
      - name: M5 Circle repository and widgets
        run: flutter test test/features/circles/
      - name: M3/M6 encrypted Profile avatar widget and mapping regressions
        run: |
          dart analyze lib/features/profile/data/orbit_profile_settings_repository.dart lib/features/profile/presentation/screens/orbit_my_profile_screen.dart lib/features/profile/presentation/screens/edit_profile_screen.dart lib/features/profile/domain/models
          flutter test test/features/profile/presentation/edit_profile_screen_test.dart test/features/profile/orbit_profile_settings_repository_test.dart
      - name: M3 profile/offline regression
        run: flutter test test/features/auth/orbit_m3_offline_profile_test.dart
      - name: Analyze consolidated M2-M4 session and startup flows
        run: |
          dart analyze lib/features/splash lib/features/auth/presentation/screens/orbit_sessions_screen.dart lib/features/auth/presentation/screens/device_registration_screen.dart lib/features/auth/presentation/screens/orbit_offline_profile_screen.dart lib/features/auth/presentation/screens/orbit_account_deletion_status_screen.dart lib/features/profile/presentation/screens/devices_screen.dart lib/core/widgets/orbit_gradient_scaffold_messenger.dart lib/core/widgets/app_text_field.dart lib/main.dart
      - name: M3 devices, sessions, recovery and splash regressions
        run: |
          flutter test test/features/auth/presentation/orbit_sessions_screen_test.dart test/features/profile/presentation/screens/devices_screen_test.dart test/features/auth/presentation/device_approval_screen_test.dart test/features/auth/orbit_m3_restricted_screen_styles_test.dart
          flutter test test/features/splash/
          flutter test test/app/orbit_app_navigation_test.dart
      - name: Validate iOS plist XML structure
        run: python3 -c "import plistlib; plistlib.load(open('ios/Runner/Info.plist','rb'))"
      - name: Android debug build with native M4 plugins
        run: flutter build apk --debug
      - name: Save Android debug build for M4 device acceptance
        uses: actions/upload-artifact@v4
        with:
          name: orbit-m5-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
