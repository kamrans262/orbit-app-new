name: Orbit M7 Flutter Moments validation
on:
  push:
    branches: [feature/m7-moments-flutter]
  pull_request:
    branches: [feature/m6-media-flutter-integration]
permissions:
  contents: read
concurrency:
  group: orbit-m7-flutter-validation
  cancel-in-progress: true
jobs:
  moments:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze M7 and existing Orbit UI integration
        run: |
          dart analyze lib/features/moments lib/features/media lib/features/home/presentation/screens/home_screen.dart lib/app/app.dart lib/core/widgets/orbit_gradient_scaffold_messenger.dart
      - name: M7, M6 crypto and media regression tests
        run: flutter test test/features/moments test/features/media
      - name: Existing Friends UI regression tests
        run: flutter test test/features/friends
