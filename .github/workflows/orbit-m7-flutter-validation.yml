name: Orbit M7 Flutter Moments validation
on:
  push:
    branches: [feature/m7-moments-flutter]
  pull_request:
    branches: [feature/m6-media-flutter-integration]
permissions:
  contents: read
concurrency:
  group: orbit-m7-flutter-validation
  cancel-in-progress: true
jobs:
  moments:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze M7 and existing Orbit UI integration
        run: |
          dart analyze lib/features/moments lib/features/media lib/features/home/presentation/screens/home_screen.dart lib/app/app.dart lib/core/widgets/orbit_gradient_scaffold_messenger.dart
      - name: Only affected M7 publishing, offline vault and M6 outbox regression tests
        run: |
          flutter test test/features/moments/presentation/widgets/orbit_m7_live_publish_test.dart
          flutter test test/features/moments/data/orbit_moment_intent_vault_test.dart
          flutter test test/features/media/orbit_media_recovery_coordinator_test.dart

  android-native-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile native recording, media playback and M7 integration
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-m7-android-debug-ci-only
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  ios-simulator-compile:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile native iOS recording and E2EE video player without signing
        run: flutter build ios --simulator --no-codesign --no-pub
