name: Orbit M7 Flutter Moments validation
on:
  push:
    branches: [feature/m7-moments-flutter, integration/m2-m5-flutter-consolidated-2026-10-24]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: "Run only the needed M7 validation (other jobs are skipped)"
        options: [android, ios, moments]
        default: android
permissions:
  contents: read
concurrency:
  group: orbit-m7-flutter-validation
  cancel-in-progress: true
jobs:
  moments:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'moments') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze M7 and existing Orbit UI integration
        run: |
          dart analyze lib/features/moments lib/features/media lib/features/home/presentation/screens/home_screen.dart lib/features/home/presentation/screens/orbit_live_home_screen.dart lib/features/auth/data/orbit_identity_client.dart lib/core/navigation/orbit_invite_link_runtime.dart lib/core/popups/orbit_popup_variants.dart lib/app/app.dart lib/core/widgets/orbit_gradient_scaffold_messenger.dart
      - name: Only affected M7 publishing, offline vault and M6 outbox regression tests
        run: |
          flutter test test/features/moments/presentation/widgets/orbit_m7_live_publish_test.dart
          flutter test test/features/moments/presentation/widgets/orbit_m7_gallery_capture_test.dart
          flutter test test/features/moments/data/orbit_moment_intent_vault_test.dart
          flutter test test/features/moments/data/orbit_moment_capture_vault_test.dart
          flutter test test/features/moments/data/moment_photo_processor_test.dart
          flutter test test/features/media/orbit_media_recovery_coordinator_test.dart
          flutter test test/features/moments/data/orbit_moment_offline_cache_test.dart
          flutter test --dart-define=ORBIT_M7_MOMENTS_ENABLED=true test/features/moments/data/orbit_m7_background_retry_test.dart
          flutter test test/features/moments/data/orbit_moment_bookmark_vault_test.dart
          flutter test test/features/moments/presentation/widgets/orbit_m7_stage4_revocation_test.dart
          flutter test test/features/moments/presentation/widgets/orbit_m7_circle_profile_privacy_test.dart
          flutter test test/features/moments/presentation/moments_screen_test.dart

  android-native-compile:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/integration/m2-m5-flutter-consolidated-2026-10-24') || (github.event_name == 'workflow_dispatch' && inputs.target == 'android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile native recording, media playback and M7 integration
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-m7-android-debug-ci-only
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  ios-simulator-compile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'ios' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile native iOS recording and E2EE video player without signing
        run: flutter build ios --simulator --no-codesign --no-pub
