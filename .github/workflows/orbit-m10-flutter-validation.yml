name: Orbit M10 location focused Flutter validation
on:
  push:
    branches: [integration/m2-m5-flutter-consolidated-2026-10-24]
    paths:
      - '.github/workflows/orbit-m10-flutter-validation.yml'
      - 'lib/features/location/**'
      - 'lib/features/orbit/presentation/screens/orbit_screen.dart'
      - 'lib/features/home/presentation/screens/home_screen.dart'
      - 'lib/features/profile/presentation/screens/orbit_preferences_screens.dart'
      - 'lib/app/app.dart'
      - 'lib/features/welcome/presentation/screens/share_location_screen.dart'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'ios/Runner/Info.plist'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/features/location/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m10-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install pinned dependencies
        run: flutter pub get
      - name: Analyze only M10 and changed integration files
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/features/location \
            lib/features/orbit/presentation/screens/orbit_screen.dart \
            lib/features/home/presentation/screens/home_screen.dart \
            lib/features/profile/presentation/screens/orbit_preferences_screens.dart \
            test/features/location
      - name: Focused contract and existing Orbits presentation tests
        run: flutter test --no-pub test/features/location
