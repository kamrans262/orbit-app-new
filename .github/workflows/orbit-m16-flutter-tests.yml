name: Orbit M16 SOS Flutter integration verification
on:
  push:
    branches: [feature/m16-sos-safety-flutter-2026-11-23]
    paths:
      - '.github/workflows/orbit-m16-flutter-tests.yml'
      - 'lib/features/sos/**'
      - 'lib/features/notifications/data/orbit_notification_push_runtime.dart'
      - 'lib/features/home/presentation/screens/orbit_live_home_screen.dart'
      - 'lib/app/app.dart'
      - 'lib/app/routing/app_routes.dart'
      - 'test/features/sos/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze SOS, Home and app routing
        run: |
          dart analyze lib/features/sos \
            lib/features/notifications/data/orbit_notification_push_runtime.dart \
            lib/features/home/presentation/screens/orbit_live_home_screen.dart \
            lib/app/app.dart lib/app/routing/app_routes.dart \
            test/features/sos
      - name: Verify M16 and preserved SOS approved UI
        run: flutter test test/features/sos
      - name: Verify Home, Plans and notification integration
        run: |
          flutter test test/features/home/presentation/m8_home_sections_test.dart
          flutter test test/features/plans/orbit_m15_plans_contract_test.dart
          flutter test test/features/notifications/orbit_notification_contract_test.dart
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: CI-only disposable Firebase compile registration
        run: |
          test ! -e android/app/google-services.json
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "orbit-ci-compile-only",
              "storage_bucket": "orbit-ci-compile-only.invalid"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                "android_client_info": {"package_name": "com.orbit.orbit_app"}
              },
              "api_key": [{"current_key": "CI_ONLY_NOT_A_REAL_GOOGLE_API_KEY"}]
            }],
            "configuration_version": "1"
          }
          EOF
          test -z "$(git ls-files android/app/google-services.json)"
      - run: flutter build apk --debug
      - run: test -s build/app/outputs/flutter-apk/app-debug.apk


  ios-no-sign-build:
    # Compiles against Apple's SDK; unsigned output is never distributed.
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Record Apple SDK and CocoaPods
        run: |
          xcodebuild -version
          pod --version
      - name: Resolve existing Flutter plugins
        run: flutter pub get
      - name: Build unsigned iOS debug app
        run: flutter build ios --debug --no-codesign
      - name: Verify unsigned app bundle
        run: test -d build/ios/iphoneos/Runner.app
