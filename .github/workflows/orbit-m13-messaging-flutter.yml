name: Orbit M13 focused Flutter Messaging verification
concurrency:
  group: orbit-m13-messaging-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [integration/m2-m5-flutter-consolidated-2026-10-24]
    paths:
      - '.github/workflows/orbit-m13-messaging-flutter.yml'
      - 'lib/features/messaging/**'
      - 'lib/features/media/data/orbit_media_repository.dart'
      - 'lib/core/chat/**'
      - 'lib/features/messages/**'
      - 'lib/features/direct_chat/**'
      - 'lib/features/group_chat/**'
      - 'lib/features/circles/presentation/screens/friend_details_screen.dart'
      - 'lib/features/circles/presentation/screens/orbit_live_circle_detail_screen.dart'
      - 'lib/features/friends/presentation/screens/orbit_person_screen.dart'
      - 'lib/features/home/presentation/screens/orbit_live_home_screen.dart'
      - 'lib/features/auth/data/orbit_identity_client.dart'
      - 'pubspec.yaml'
      - 'native/orbit_vodozemac/**'
      - 'lib/main.dart'
      - 'test/features/messaging/**'
      - 'test/core/chat/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-messaging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Focused M13 integration analysis
        run: |
          dart analyze lib/features/messaging \
            lib/features/messages/presentation/screens/messages_screen.dart \
            lib/features/direct_chat/presentation/screens/direct_chat_screen.dart \
            lib/features/direct_chat/presentation/widgets/direct_chat_input_bar.dart \
            lib/features/group_chat/presentation/screens/group_chat_screen.dart \
            lib/features/group_chat/presentation/widgets/chat_input_bar.dart \
            lib/features/circles/presentation/screens/friend_details_screen.dart \
            lib/features/circles/presentation/screens/orbit_live_circle_detail_screen.dart \
            lib/features/friends/presentation/screens/orbit_person_screen.dart \
            lib/features/home/presentation/screens/orbit_live_home_screen.dart \
            lib/features/auth/data/orbit_identity_client.dart
      - name: Messaging safety + existing chat widget regressions
        run: |
          flutter test test/features/messaging \
            test/features/direct_chat \
            test/features/group_chat \
            test/core/chat

  native-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate a reviewable dependency lock only if absent
        working-directory: native/orbit_vodozemac
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Emit native dependency lock for one-time reproducibility review
        working-directory: native/orbit_vodozemac
        run: |
          echo BEGIN_ORBIT_M13_CARGO_LOCK
          base64 -w0 Cargo.lock
          echo
          echo END_ORBIT_M13_CARGO_LOCK
      - name: Check audited-core bridge and run unit tests
        working-directory: native/orbit_vodozemac
        run: |
          cargo test --locked
          cargo build --release --locked
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies for native ABI tests
        run: flutter pub get
      - name: Actual Dart to Rust Olm and Megolm roundtrips
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/orbit_vodozemac/target/release
          ORBIT_M13_NATIVE_REQUIRED: '1'
        run: |
          flutter test test/features/messaging/orbit_vodozemac_native_roundtrip_test.dart \
            test/features/messaging/orbit_vodozemac_provider_integration_test.dart
      - name: No-production-enablement assertion
        shell: bash
        run: |
          grep -q "releaseCertified=false" lib/features/messaging/data/orbit_messaging_vodozemac_cipher.dart
          echo "Cryptographic integration remains review-gated."
