name: Orbit M13 focused Flutter Messaging verification
on:
  push:
    branches: [integration/m2-m5-flutter-consolidated-2026-10-24]
    paths:
      - '.github/workflows/orbit-m13-messaging-flutter.yml'
      - 'lib/features/messaging/**'
      - 'lib/features/messages/**'
      - 'lib/features/direct_chat/**'
      - 'lib/features/group_chat/**'
      - 'lib/features/circles/presentation/screens/friend_details_screen.dart'
      - 'lib/features/circles/presentation/screens/orbit_live_circle_detail_screen.dart'
      - 'lib/features/friends/presentation/screens/orbit_person_screen.dart'
      - 'lib/features/home/presentation/screens/orbit_live_home_screen.dart'
      - 'lib/features/auth/data/orbit_identity_client.dart'
      - 'pubspec.yaml'
      - 'test/features/messaging/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-messaging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Focused M13 integration analysis
        run: |
          dart analyze lib/features/messaging \
            lib/features/messages/presentation/screens/messages_screen.dart \
            lib/features/direct_chat/presentation/screens/direct_chat_screen.dart \
            lib/features/direct_chat/presentation/widgets/direct_chat_input_bar.dart \
            lib/features/group_chat/presentation/screens/group_chat_screen.dart \
            lib/features/group_chat/presentation/widgets/chat_input_bar.dart \
            lib/features/circles/presentation/screens/friend_details_screen.dart \
            lib/features/circles/presentation/screens/orbit_live_circle_detail_screen.dart \
            lib/features/friends/presentation/screens/orbit_person_screen.dart \
            lib/features/home/presentation/screens/orbit_live_home_screen.dart \
            lib/features/auth/data/orbit_identity_client.dart
      - name: Messaging safety + existing chat widget regressions
        run: |
          flutter test test/features/messaging \
            test/features/direct_chat \
            test/features/group_chat \
            test/core/chat
