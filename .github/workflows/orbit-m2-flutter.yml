name: Orbit Flutter M2 validation
on:
  push:
    branches: [feature/m2-auth-identity]
  pull_request:
    branches: [main]
jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Check authentication code with Dart analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/auth/data/orbit_identity_client.dart lib/features/auth/presentation/screens/orbit_otp_sign_in_screen.dart lib/app/app.dart lib/features/profile/presentation/screens/profile_settings_screen.dart lib/features/auth/presentation/screens/login_screen.dart lib/features/auth/presentation/screens/sign_up_screen.dart lib/features/auth/presentation/widgets/auth_divider.dart
      - name: Auth/navigation widget tests
        run: flutter test test/app/home_access_from_login_test.dart test/app/login_navigation_test.dart test/app/sign_up_navigation_test.dart test/features/auth
