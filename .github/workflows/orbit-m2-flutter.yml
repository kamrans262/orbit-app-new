name: Orbit Flutter M2 + M3 validation
on:
  push:
    branches: [feature/m2-auth-identity, feature/m3-profiles-settings]
  pull_request:
    branches: [main, feature/m2-auth-identity]
concurrency:
  group: orbit-m2-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Check authentication code with Dart analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/auth/domain/orbit_auth_validation.dart lib/features/auth/presentation/screens/orbit_password_reset_flow.dart lib/features/auth/presentation/screens/reset_password_screen.dart lib/features/auth/data/orbit_identity_client.dart lib/features/auth/presentation/screens/orbit_otp_verification_controller.dart lib/features/auth/presentation/screens/verify_otp_screen.dart lib/features/auth/presentation/screens/device_registration_screen.dart lib/features/auth/presentation/widgets/orbit_auth_channel_selector.dart lib/app/app.dart lib/features/profile/presentation/screens/profile_settings_screen.dart lib/features/auth/presentation/screens/login_screen.dart lib/features/auth/presentation/screens/sign_up_screen.dart lib/features/auth/presentation/widgets/auth_divider.dart lib/features/profile/data/orbit_profile_settings_repository.dart lib/features/profile/presentation/screens/orbit_my_profile_screen.dart lib/features/profile/presentation/screens/orbit_preferences_screens.dart lib/features/profile/presentation/screens/profile_screen.dart lib/features/profile/presentation/navigation/profile_navigation.dart
      - name: Auth/navigation widget tests
        run: flutter test test/app/reset_password_navigation_test.dart test/app/home_access_from_login_test.dart test/app/login_navigation_test.dart test/app/sign_up_navigation_test.dart test/app/orbit_app_navigation_test.dart test/app/circle_permission_navigation_test.dart test/app/invite_people_navigation_test.dart test/app/onboarding_skip_navigation_test.dart test/features/auth test/features/profile/orbit_profile_settings_repository_test.dart
