name: Orbit M17 Moderation Flutter integration verification
on:
  push:
    branches: [feature/m17-moderation-flutter-2026-11-24]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moderation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze M17 and touched approved profile surfaces
        run: |
          dart analyze lib/features/moderation \
            lib/features/profile/presentation/screens/report_user_screen.dart \
            lib/features/profile/presentation/screens/profile_settings_screen.dart \
            lib/features/friends/presentation/screens/orbit_person_screen.dart \
            lib/features/auth/data/orbit_identity_client.dart \
            test/features/moderation
      - name: M17 behavior and private authorization contracts
        run: flutter test test/features/moderation
      # The unrelated legacy Profile long-stat synthetic fixture is excluded:
      # it already overflows in the pre-M17 approved UI, and M17 does not alter
      # that layout. The dedicated compact Profile tests remain unchanged.
      - name: Existing approved Report User widget and navigation regression
        run: |
          flutter test test/features/profile/presentation/report_user_screen_test.dart
          flutter test test/features/profile/presentation/report_user_navigation_test.dart
      - name: Existing M4, M7, M13, M15 and M16 integration regression
        run: |
          flutter test test/features/friends/orbit_m4_social_repository_test.dart
          flutter test test/features/sos/orbit_m16_sos_contract_test.dart
          flutter test test/features/plans/orbit_m15_plans_contract_test.dart
          flutter test test/features/notifications/orbit_notification_contract_test.dart

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: CI-only disposable Firebase registration
        run: |
          test ! -e android/app/google-services.json
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "orbit-ci-compile-only",
              "storage_bucket": "orbit-ci-compile-only.invalid"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                "android_client_info": {"package_name": "com.orbit.orbit_app"}
              },
              "api_key": [{"current_key": "CI_ONLY_NOT_A_REAL_GOOGLE_API_KEY"}]
            }],
            "configuration_version": "1"
          }
          EOF
          test -z "$(git ls-files android/app/google-services.json)"
      - run: flutter build apk --debug
      - run: test -s build/app/outputs/flutter-apk/app-debug.apk

  ios-no-sign-build:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Build unsigned debug iOS application
        run: flutter build ios --debug --no-codesign
      - run: test -d build/ios/iphoneos/Runner.app
