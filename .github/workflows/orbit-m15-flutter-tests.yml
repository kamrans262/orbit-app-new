name: Orbit M15 focused Plans and Reminders Flutter verification
on:
  push:
    branches: [feature/m15-plans-flutter-2026-11-10]
    paths:
      - '.github/workflows/orbit-m15-flutter-tests.yml'
      - 'lib/features/plans/**'
      - 'lib/features/home/presentation/screens/orbit_live_home_screen.dart'
      - 'lib/features/create/presentation/screens/orbit_create_sheet.dart'
      - 'lib/features/notifications/**'
      - 'lib/features/auth/data/orbit_identity_client.dart'
      - 'lib/app/**'
      - 'test/features/plans/**'
      - 'test/features/notifications/orbit_notification_contract_test.dart'
      - 'test/features/create/orbit_create_sheet_current_layout_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plans:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze M15 and modified integrations
        run: |
          dart analyze lib/features/plans \
            lib/features/home/presentation/screens/orbit_live_home_screen.dart \
            lib/features/create/presentation/screens/orbit_create_sheet.dart \
            lib/features/notifications/data/orbit_notification_repository.dart \
            lib/features/notifications/presentation/orbit_live_notifications_screen.dart \
            lib/features/auth/data/orbit_identity_client.dart \
            lib/app/app.dart lib/app/routing/app_routes.dart \
            test/features/plans
      - name: Run focused M15 and preserved M8/M14/Create regressions
        run: |
          flutter test test/features/plans
          flutter test test/features/notifications/orbit_notification_contract_test.dart
          flutter test test/features/create/orbit_create_sheet_current_layout_test.dart
          flutter test test/features/home/presentation/m8_home_sections_test.dart

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve current plugins
        run: flutter pub get
      - name: Print plugin lock delta for review
        run: git diff -- pubspec.lock
      - name: Provide CI-only synthetic Firebase app registration
        # A disposable compile fixture, NOT a real Firebase project, API key,
        # service account, push credential, production app configuration or
        # artifact to be published. Real configs remain locally untracked.
        run: |
          test ! -e android/app/google-services.json
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "orbit-ci-compile-only",
              "storage_bucket": "orbit-ci-compile-only.invalid"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                  "android_client_info": {
                    "package_name": "com.orbit.orbit_app"
                  }
                },
                "api_key": [
                  {
                    "current_key": "CI_ONLY_NOT_A_REAL_GOOGLE_API_KEY"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          test -s android/app/google-services.json
          test -z "$(git ls-files android/app/google-services.json)"
      - name: Compile complete M15 Android debug APK
        run: flutter build apk --debug
      - name: Verify Android artifact
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

  ios-no-sign-build:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Record iOS SDK and CocoaPods versions
        run: |
          xcodebuild -version
          pod --version
      - name: Resolve current plugins
        run: flutter pub get
      - name: Compile complete unsigned iOS app
        run: flutter build ios --debug --no-codesign
      - name: Verify iOS build artifact
        run: test -d build/ios/iphoneos/Runner.app
