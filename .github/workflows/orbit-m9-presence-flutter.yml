name: Orbit M9 Flutter Presence focused validation
on:
  push:
    branches: [feature/m9-presence-flutter]
    paths:
      - 'lib/features/presence/**'
      - 'lib/features/auth/data/orbit_identity_client.dart'
      - 'lib/features/auth/presentation/widgets/orbit_session_welcome_gate.dart'
      - 'lib/features/circles/presentation/screens/orbit_live_circle_detail_screen.dart'
      - 'test/features/presence/**'
      - '.github/workflows/orbit-m9-presence-flutter.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbit-m9-presence-flutter
  cancel-in-progress: true
jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get
      - name: Analyze only M9 and integration touchpoints
        run: |
          dart analyze lib/features/presence lib/features/auth/data/orbit_identity_client.dart lib/features/auth/presentation/widgets/orbit_session_welcome_gate.dart lib/features/circles/presentation/screens/orbit_live_circle_detail_screen.dart test/features/presence
      - name: Test M9 privacy and REST contracts
        run: flutter test test/features/presence
      - name: Check original M5 Circle integration regressions
        run: |
          flutter test test/features/circles/orbit_m5_live_circles_test.dart
          flutter test test/features/circles/orbit_m5_explicit_settings_save_test.dart
