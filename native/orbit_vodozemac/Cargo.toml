[package]
name = "orbit_vodozemac"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "First-party Flutter FFI bridge to Apache-2.0 vodozemac Olm and Megolm"

[lib]
name = "orbit_vodozemac"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Pinned audited ratchet implementation. Do not switch to libolm or a
# handwritten crypto protocol.
vodozemac = "=0.11.1"
serde_json = "1.0"
base64 = "0.22"

[profile.release]
# The FFI catch_unwind boundary must remain effective in release builds.
# Panics must never unwind across an extern C ABI into the Flutter process.
panic = "unwind"
lto = true
codegen-units = 1
strip = true
